name: Nightly Benchmark

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Peer sandbox benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup toolchain install stable --component clippy --component rustfmt

      - name: Select stable toolchain
        run: rustup override set stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: nightly-benchmark

      - name: Doctor
        run: cargo run --locked -- doctor

      - name: Validate
        run: cargo run --locked -- validate

      - name: Benchmark peers
        run: cargo run --locked -- bench --peer-target auto --iterations 1 --warmups 0 --format json --output benchmark.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: microbox-nightly-benchmark
          path: benchmark.json
          if-no-files-found: error
