name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            package_name: microbox-linux-x86_64.tar.gz
          - os: macos-latest
            shell: bash
            package_name: microbox-macos.tar.gz
          - os: windows-latest
            shell: pwsh
            package_name: microbox-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        shell: ${{ matrix.shell }}
        run: rustup toolchain install stable --component clippy --component rustfmt

      - name: Select stable toolchain
        shell: ${{ matrix.shell }}
        run: rustup override set stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build release binary
        shell: ${{ matrix.shell }}
        run: cargo build --release --locked

      - name: Package release binary
        if: runner.os != 'Windows'
        shell: ${{ matrix.shell }}
        run: |
          mkdir -p dist
          cp target/release/microbox dist/microbox
          tar -czf "dist/${{ matrix.package_name }}" -C dist microbox
          sha256sum "dist/${{ matrix.package_name }}" > "dist/${{ matrix.package_name }}.sha256"

      - name: Package release binary
        if: runner.os == 'Windows'
        shell: ${{ matrix.shell }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/microbox.exe dist/microbox.exe
          Compress-Archive -Path dist/microbox.exe -DestinationPath "dist/${{ matrix.package_name }}" -Force
          $hash = (Get-FileHash "dist/${{ matrix.package_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.package_name }}" | Set-Content -NoNewline -Path "dist/${{ matrix.package_name }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.package_name }}
          if-no-files-found: error

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}.sha256
          path: dist/${{ matrix.package_name }}.sha256
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
