name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-platform:
    name: Cross-platform contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup toolchain install stable --component clippy --component rustfmt

      - name: Select stable toolchain
        run: rustup override set stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: cross-platform

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Doctor smoke test
        run: cargo run --locked -- doctor

      - name: Validate smoke test
        run: cargo run --locked -- validate

      - name: Compat runtime smoke test
        run: cargo run --locked -- run echo hello

  linux-secure:
    name: Linux secure smoke
    runs-on: ubuntu-latest
    needs: cross-platform
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup toolchain install stable --component clippy --component rustfmt

      - name: Select stable toolchain
        run: rustup override set stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: linux-secure

      - name: Secure runtime smoke test
        run: cargo run --locked -- run --backend secure echo hello

      - name: Benchmark smoke test
        run: cargo run --locked -- bench --iterations 1 --warmups 0 --format json --output bench-report.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: microbox-benchmark-report
          path: bench-report.json
          if-no-files-found: error
